# 和 GoEuroOps 共用一台 2 vCPU / 2 GiB 的演示服务器时叠加：
#   docker compose --profile app -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# 本地开发不受影响：不叠加这份文件时，一切和原来一样。
#
# 1. 内存调优：MySQL、Kafka、Qdrant、MinIO 按小机器收紧，空闲时合计约 700MB（默认约 1.5GB）
# 2. CPU 限额：视频处理（server-go 及其调起的 ffmpeg / tesseract）最多用 1 个核，
#    另一个核留给系统和 SSH，分析视频时机器不会卡死
# 3. 对外只经 GoEuroOps 的 Caddy（HTTPS + 访问口令）：web、minio、jaeger 接入 goeuroops_default 网络
# 4. Prometheus 不启动（需要时加 --profile monitoring）

x-edge: &edge
  networks:
    default: {}
    edge: {}

# 容器日志默认不轮转，长期运行会越积越大：每个容器最多 3 个 10MB 文件
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    <<: *logging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=16M
      - --innodb-log-buffer-size=4M
      - --max-connections=30
      - --table-open-cache=128
      - --table-definition-cache=256
      - --tmp-table-size=4M
      - --max-heap-table-size=4M
      - --thread-cache-size=4
      - --skip-name-resolve
    mem_limit: 300m
    cpus: 0.5

  kafka:
    <<: *logging
    environment:
      # 日志压缩的去重缓冲区默认 128MB，会直接撑爆小堆；演示数据量很小，8MB 足够
      KAFKA_HEAP_OPTS: -Xms48m -Xmx128m
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 8388608
      # 只用 C1 编译器、限制代码缓存 / 线程栈 / 直接内存：演示流量极小，吞吐不是目标
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:+UseSerialGC -XX:MaxMetaspaceSize=80m -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m -Xss512k -XX:MaxDirectMemorySize=32m -XX:+ExitOnOutOfMemoryError -Djava.awt.headless=true
      KAFKA_NUM_NETWORK_THREADS: 1
      KAFKA_NUM_IO_THREADS: 2
      KAFKA_BACKGROUND_THREADS: 2
      KAFKA_LOG_CLEANER_THREADS: 1
    # 默认健康检查每次启动一个 JVM 命令行工具，在半个核上 10 秒跑不完；改成探测端口
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':</dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 400m
    cpus: 0.5

  qdrant:
    <<: *logging
    environment:
      QDRANT__SERVICE__MAX_WORKERS: 1
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 1
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: 1
    mem_limit: 200m
    cpus: 0.5

  minio:
    <<: [*edge, *logging]
    # MinIO 官方已不再公开发布镜像（quay.io / Docker Hub 均拉不到），改用 Chainguard
    # 从开源源码构建的版本，按摘要固定。它以 UID 65532 运行，数据目录需要先 chown。
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    environment:
      GOMAXPROCS: 1
      GOGC: 50
      GOMEMLIMIT: 96MiB
    mem_limit: 256m
    cpus: 0.5

  jaeger:
    <<: [*edge, *logging]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "2000"
    mem_limit: 128m

  redis:
    <<: *logging
    mem_limit: 64m

  prometheus:
    <<: *logging
    profiles: ["monitoring"]

  agent-py:
    <<: *logging
    environment:
      # 线上实测一次分析约 2 分钟，几乎全花在模型接口上（Planner 33s、Executor 21s + 54s、Critic 12s），
      # 默认 120s 预算在第二轮就用完；放宽到 300s。server-go 的运行超时按它自动加 60s。
      AGENT_MAX_DURATION_MS: ${AGENT_MAX_DURATION_MS:-300000}
    mem_limit: 400m
    cpus: 0.75

  server-go:
    <<: *logging
    environment:
      MINIO_PUBLIC_ENDPOINT: https://s3-vparser.${SITE_ADDRESS:?在 .env 里设置 SITE_ADDRESS，与 GoEuroOps 相同}
      CORS_ALLOWED_ORIGINS: https://vparser.${SITE_ADDRESS}
      GOMEMLIMIT: 200MiB
      AGENT_MAX_DURATION_MS: ${AGENT_MAX_DURATION_MS:-300000}
    mem_limit: 700m
    memswap_limit: 1200m
    cpus: 1.0

  web:
    <<: [*edge, *logging]
    ports: !reset []
    mem_limit: 64m

networks:
  edge:
    name: goeuroops_default
    external: true
