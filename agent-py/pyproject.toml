[project]
name = "dovideo-agent"
version = "0.1.0"
description = "Vparser agent service: Planner / Executor / Critic video analysis over gRPC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio>=1.84",
    "grpcio-health-checking>=1.84",
    "protobuf>=7.35.1",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-instrumentation-grpc>=0.51b0",
    "opentelemetry-instrumentation-redis>=0.51b0",
    "opentelemetry-instrumentation-pymysql>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.54",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=43",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "fakeredis>=2.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
