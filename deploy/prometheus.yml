global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Targets are the compose service names. When running the services on the host instead,
# replace them with host.docker.internal:9090 / host.docker.internal:9464.
scrape_configs:
  - job_name: server-go
    metrics_path: /metrics
    static_configs:
      - targets: ["server-go:9090"]
  - job_name: agent-py
    static_configs:
      - targets: ["agent-py:9464"]
